<div class="page">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="logo">⚡</div>
      <h1>URL Shortener</h1>
      <p class="subtitle">Paste a long URL and get a clean short link instantly</p>
    </div>

    <!-- Input row -->
    <div class="input-row">
      <input
        class="url-input"
        type="url"
        placeholder="https://your-very-long-url.com/goes/here"
        [value]="longUrl()"
        (input)="longUrl.set($any($event.target).value)"
        (keydown.enter)="shorten()"
        [disabled]="loading()"
      />
      <button
        class="btn-primary"
        (click)="shorten()"
        [disabled]="loading() || !longUrl().trim()"
      >
        @if (loading()) {
          <span class="spinner"></span>
        } @else {
          Shorten →
        }
      </button>
    </div>

    <!-- Error -->
    @if (error()) {
      <p class="error-msg">⚠ {{ error() }}</p>
    }

    <!-- Result -->
    @if (shortUrl()) {
      <div class="result-card">
        <a class="short-link" [href]="shortUrl()" target="_blank" rel="noopener">
          {{ shortUrl() }}
        </a>
        <div class="result-actions">
          <button class="btn-copy" (click)="copy()">
            {{ copied() ? '✓ Copied!' : 'Copy' }}
          </button>
          <button class="btn-reset" (click)="reset()">New</button>
        </div>
      </div>

      <!-- Analytics -->
      @if (analytics()) {
        <div class="analytics">
          <span class="stat"><strong>{{ analytics()!.clickCount }}</strong> clicks</span>
          <span class="divider">·</span>
          <span class="stat">created {{ analytics()!.createdAt | date:'mediumDate' }}</span>
        </div>
      }
    }

  </div>
</div>
