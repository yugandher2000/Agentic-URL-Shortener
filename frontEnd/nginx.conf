server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for index.html so the app always loads fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
